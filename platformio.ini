; PlatformIO Project Configuration File
;
; ESP32 MQTT Noise Generator
; Target: ESP32 DevKit V1 / ESP32 Dev Module
;
; Source files are currently kept in the repository root to preserve
; compatibility with the original Arduino IDE project.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial console
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Standard USB/UART bootloader upload
upload_protocol = esptool
upload_speed = 460800

; Project libraries
; Versions match libraries_lock.json.
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
    tzapu/WiFiManager @ 2.0.17
    knolleary/PubSubClient @ 2.8.0
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.4

; The repository root contains documentation, HA YAML, Node-RED JSON,
; and library metadata. Only firmware source files are compiled.
build_src_filter =
    +<*.ino>
    +<*.cpp>
