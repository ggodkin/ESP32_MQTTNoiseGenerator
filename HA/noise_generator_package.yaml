# Home Assistant configuration for the ESP32 MQTT Noise Generator.
#
# Core controls no longer require static helpers or per-device automations.
# The ESP32 publishes Home Assistant MQTT Discovery entities directly.
#
# Recommended setup:
#   1. Enable the Home Assistant MQTT integration.
#   2. Configure each ESP32 with a unique mqttId, haUniqueId, and mqttBase.
#   3. Use the discovered NoiseGen device/entities from Home Assistant.
#
# Example devices used by the project:
#   hroom     -> hroom/noise
#   mbedroom  -> mbedroom/noise
#
# This package is intentionally empty so old installations can keep the file
# without recreating the previous per-device input_select/template/automation
# configuration. Remove the old generated helpers from Home Assistant after
# migrating to MQTT Discovery.

# No static entities are required.
