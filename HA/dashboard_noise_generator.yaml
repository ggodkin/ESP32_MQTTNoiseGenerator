# MQTT Discovery creates a separate NoiseGen device in Home Assistant
# for every ESP32. Use the device's automatically discovered entities in
# the Home Assistant dashboard.
#
# This file is intentionally a reference card rather than a device-specific
# dashboard because Home Assistant entity IDs are generated from discovery
# and can differ between installations.
#
# For each NoiseGen device, add an Entities card containing the discovered:
#   - Mode
#   - Gain
#   - Mute
#   - Online
#   - Temperature (when DS18B20 is enabled)
#
# No input_select or template entities are required.
